[package]
name = "gnome-rusty-starter-left-sidebar"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Rust + GTK4 + libadwaita starter with a left navigation sidebar for GNOME applications"

[lib]
name = "gnome_rusty_starter_left_sidebar"
path = "src/lib.rs"

[[bin]]
name = "gnome-rusty-starter-left-sidebar"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["gnome_50"] }
